dimensions: 3
# Linear-Sparse-Grid Configuration
n_grids: 240            # Number of offset grids (reduced for 3D memory) should be a multiple of 24 because crystals or something
grid_size: 16         # Base resolution per grid (32x32x32)
world_size: 100.0
num_particles: 1e6
# num_particles: 5e6 # this is just too many i cant even see. it runs well but i cant see its too bright
G: 1.0
dt: 0.00001
particle_mass: 1.0
damping: 0.999         # Velocity damping per step (1.0 = no damping, 0.99 = light, 0.9 = heavy)

# Particle initialization
spawn_buffer: 0.2      # Fraction of world_size to keep clear from edges (0.0-0.5)
