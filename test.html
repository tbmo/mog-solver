<!DOCTYPE html>
<html>
<head>
  <title>Intersection of Rotated Grids</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: sans-serif;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 8px;
      width: 250px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9em;
    }
    input[type=range] {
      width: 100%;
    }
    .value {
      float: right;
      font-weight: bold;
      color: #4af;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h3>Grid Intersection</h3>
    <label>
      Number of Cubes (N)
      <span id="n_val" class="value">60</span>
      <input type="range" id="n_slider" min="1" max="120" value="60" step="1">
    </label>
    <label>
      Offset Scale (Voxel Size)
      <span id="off_val" class="value">0.00</span>
      <input type="range" id="off_slider" min="0" max="2.0" value="0" step="0.01">
    </label>
    <label>
      Cube Size
      <span id="size_val" class="value">1.8</span>
      <input type="range" id="size_slider" min="0.5" max="3.0" value="1.8" step="0.1">
    </label>
    <div style="font-size: 0.8em; margin-top: 10px; color: #aaa;">
      Shape is defined as the intersection of N cubes.
      Use 'Offset Scale' to apply the dodecahedral shift pattern.
    </div>
  </div>
  <div id="canvas-container"></div>

  <script>
    const canvas = document.createElement('canvas');
    document.getElementById('canvas-container').appendChild(canvas);
    const gl = canvas.getContext('webgl2');

    if (!gl) {
      document.body.innerHTML = 'WebGL 2 not supported';
    }

    // === MATH & GEOMETRY ===

    const PHI = (1 + Math.sqrt(5)) / 2;

    // Dodecahedron vertices (normalized)
    function getDodecaVerts() {
      let verts = [];
      
      // (±1, ±1, ±1)
      for (let x = -1; x <= 1; x += 2)
        for (let y = -1; y <= 1; y += 2)
          for (let z = -1; z <= 1; z += 2)
            verts.push([x, y, z]);
      
      // (0, ±phi, ±1/phi)
      for (let i = -1; i <= 1; i += 2)
        for (let j = -1; j <= 1; j += 2)
          verts.push([0, i * PHI, j / PHI]);
      
      // (±1/phi, 0, ±phi)
      for (let i = -1; i <= 1; i += 2)
        for (let j = -1; j <= 1; j += 2)
          verts.push([i / PHI, 0, j * PHI]);
      
      // (±phi, ±1/phi, 0)
      for (let i = -1; i <= 1; i += 2)
        for (let j = -1; j <= 1; j += 2)
          verts.push([i * PHI, j / PHI, 0]);

      // Normalize all vertices
      return verts.map(v => {
        let len = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
        return [v[0] / len, v[1] / len, v[2] / len];
      });
    }

    // Matrix multiplication (3x3)
    function multiplyMatrices(a, b) {
      let result = new Float32Array(9);
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          result[r * 3 + c] =
            a[r * 3 + 0] * b[0 * 3 + c] +
            a[r * 3 + 1] * b[1 * 3 + c] +
            a[r * 3 + 2] * b[2 * 3 + c];
        }
      }
      return result;
    }

    // Rotation matrix from axis-angle (Rodrigues)
    function rotationMatrix(axis, angle) {
      let c = Math.cos(angle);
      let s = Math.sin(angle);
      let x = axis[0], y = axis[1], z = axis[2];
      let len = Math.sqrt(x * x + y * y + z * z);
      x /= len;
      y /= len;
      z /= len;
      let t = 1 - c;
      return [
        t * x * x + c,     t * x * y - z * s, t * x * z + y * s,
        t * x * y + z * s, t * y * y + c,     t * y * z - x * s,
        t * x * z - y * s, t * y * z + x * s, t * z * z + c
      ];
    }

    // Generate 60 icosahedral rotations
    function getIcoRotations() {
      let current_rots = [];
      let identity = [1, 0, 0, 0, 1, 0, 0, 0, 1];
      current_rots.push(identity);

      // Check if matrix is already in our list
      function isNew(m) {
        for (let r of current_rots) {
          let diff = 0;
          for (let k = 0; k < 9; k++) diff += Math.abs(r[k] - m[k]);
          if (diff < 0.01) return false;
        }
        return true;
      }

      // 5-fold axes: Icosahedron vertices
      let icoVerts = [
        [0, 1, PHI], [0, -1, PHI], [0, 1, -PHI], [0, -1, -PHI],
        [1, PHI, 0], [-1, PHI, 0], [1, -PHI, 0], [-1, -PHI, 0],
        [PHI, 0, 1], [PHI, 0, -1], [-PHI, 0, 1], [-PHI, 0, -1]
      ];
      
      // Rotations of 72°, 144°, 216°, 288° around each vertex
      for (let v of icoVerts) {
        for (let k = 1; k <= 4; k++) {
          let angle = k * 72 * Math.PI / 180;
          let m = rotationMatrix(v, angle);
          if (isNew(m)) current_rots.push(m);
        }
      }

      // 3-fold axes: Dodecahedron vertices (face centers of icosahedron)
      let dodVerts = getDodecaVerts();
      for (let v of dodVerts) {
        for (let k = 1; k <= 2; k++) {
          let angle = k * 120 * Math.PI / 180;
          let m = rotationMatrix(v, angle);
          if (isNew(m)) current_rots.push(m);
        }
      }

      // 2-fold axes: Edge midpoints (use Cartesian axes as approximation)
      let axes2 = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
      for (let v of axes2) {
        let m = rotationMatrix(v, Math.PI);
        if (isNew(m)) current_rots.push(m);
      }

      // Fill remaining by composition if we don't have 60 yet
      let header = 0;
      while (current_rots.length < 60 && header < current_rots.length) {
        let r1 = current_rots[header];
        for (let r2 of current_rots) {
          let m = multiplyMatrices(r1, r2);
          if (isNew(m)) current_rots.push(m);
          if (current_rots.length >= 60) break;
        }
        header++;
      }

      return current_rots.slice(0, 60);
    }

    const ROTATIONS = getIcoRotations();
    const DODECA_VERTS = getDodecaVerts();

    // === SHADERS ===

    const vertexShaderSource = `#version 300 es
      in vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentShaderSource = `#version 300 es
      precision highp float;

      uniform vec2 u_resolution;
      uniform float u_time;
      uniform int u_count;
      uniform float u_offset_scale;
      uniform float u_cube_size;

      // 120 matrices max: 3 vec3s per matrix = 360 vec3s
      uniform vec3 u_matrices[360];
      // 120 offsets
      uniform vec3 u_offsets[120];

      out vec4 outColor;

      // Signed distance function for a box
      float sdBox(vec3 p, vec3 b) {
        vec3 q = abs(p) - b;
        return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
      }

      // Scene: intersection of N rotated/offset cubes
      float map(vec3 p) {
        float d = -1000.0; // Start with "everything" (intersection uses max)

        for (int i = 0; i < 120; i++) {
          if (i >= u_count) break;

          vec3 off = u_offsets[i];

          // Get rotation matrix rows
          vec3 r0 = u_matrices[3 * i];
          vec3 r1 = u_matrices[3 * i + 1];
          vec3 r2 = u_matrices[3 * i + 2];

          // Transform point to local cube space
          // P_local = R^T * (P_world - offset)
          vec3 p_centered = p - off;
          vec3 p_local = vec3(
            dot(vec3(r0.x, r1.x, r2.x), p_centered),
            dot(vec3(r0.y, r1.y, r2.y), p_centered),
            dot(vec3(r0.z, r1.z, r2.z), p_centered)
          );

          float box = sdBox(p_local, vec3(u_cube_size));

          // Intersection = max of all SDFs
          d = max(d, box);
        }
        return d;
      }

      // Calculate surface normal
      vec3 calcNormal(vec3 p) {
        const float h = 0.001;
        const vec2 k = vec2(1, -1);
        return normalize(
          k.xyy * map(p + k.xyy * h) +
          k.yyx * map(p + k.yyx * h) +
          k.yxy * map(p + k.yxy * h) +
          k.xxx * map(p + k.xxx * h)
        );
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

        // Orbiting camera
        float rot = u_time * 0.2;
        vec3 ro = vec3(5.0 * sin(rot), 3.0, 5.0 * cos(rot));
        vec3 ta = vec3(0.0, 0.0, 0.0);

        // Camera basis vectors
        vec3 ww = normalize(ta - ro);
        vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
        vec3 vv = normalize(cross(uu, ww));

        // Ray direction
        vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.5 * ww);

        // Raymarching
        float t = 0.0;
        float d = 0.0;
        for (int i = 0; i < 64; i++) {
          vec3 p = ro + t * rd;
          d = map(p);
          if (d < 0.001 || t > 20.0) break;
          t += d;
        }

        // Shading
        vec3 col = vec3(0.1);
        if (t < 20.0) {
          vec3 p = ro + t * rd;
          vec3 n = calcNormal(p);
          vec3 lig = normalize(vec3(1.0, 2.0, 3.0));

          float dif = clamp(dot(n, lig), 0.0, 1.0);
          float amb = 0.5 + 0.5 * n.y;

          col = vec3(0.2, 0.6, 1.0) * dif;
          col += vec3(0.1, 0.2, 0.3) * amb;
          col += vec3(0.5) * pow(clamp(dot(reflect(-lig, n), -rd), 0.0, 1.0), 16.0);
        }

        outColor = vec4(col, 1.0);
      }
    `;

    // === WEBGL SETUP ===

    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        return null;
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl.VERTEX_SHADER, vertexShaderSource));
    gl.attachShader(program, createShader(gl.FRAGMENT_SHADER, fragmentShaderSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    // Fullscreen quad
    const quadBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'position');
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    // Uniform locations
    const uResolution = gl.getUniformLocation(program, 'u_resolution');
    const uTime = gl.getUniformLocation(program, 'u_time');
    const uCount = gl.getUniformLocation(program, 'u_count');
    const uOffsetScale = gl.getUniformLocation(program, 'u_offset_scale');
    const uCubeSize = gl.getUniformLocation(program, 'u_cube_size');
    const uMatrices = gl.getUniformLocation(program, 'u_matrices');
    const uOffsets = gl.getUniformLocation(program, 'u_offsets');

    // === UPDATE DATA FROM SLIDERS ===

    function updateData() {
      const N = parseInt(document.getElementById('n_slider').value);
      const scale = parseFloat(document.getElementById('off_slider').value);
      const cubeSize = parseFloat(document.getElementById('size_slider').value);

      document.getElementById('n_val').textContent = N;
      document.getElementById('off_val').textContent = scale.toFixed(2);
      document.getElementById('size_val').textContent = cubeSize;

      let matArray = [];
      let offArray = [];

      for (let i = 0; i < 120; i++) {
        // Offset calculation (from your Python):
        // frac = i / n_grids
        // d = dodeca_verts[i % 20]
        // offset = frac * voxel_size * d
        let frac = i < N ? i / N : 0;
        let d = DODECA_VERTS[i % 20];
        let off = [
          frac * scale * d[0],
          frac * scale * d[1],
          frac * scale * d[2]
        ];

        // Rotation (cycle through 60 icosahedral rotations)
        let rot = ROTATIONS[i % 60];

        offArray.push(...off);
        matArray.push(...rot);
      }

      gl.uniform3fv(uMatrices, new Float32Array(matArray));
      gl.uniform3fv(uOffsets, new Float32Array(offArray));
      gl.uniform1i(uCount, N);
      gl.uniform1f(uOffsetScale, scale);
      gl.uniform1f(uCubeSize, cubeSize);
    }

    // Bind slider events
    document.getElementById('n_slider').oninput = updateData;
    document.getElementById('off_slider').oninput = updateData;
    document.getElementById('size_slider').oninput = updateData;
    updateData();

    // === RENDER LOOP ===

    function render(time) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);

      gl.uniform2f(uResolution, canvas.width, canvas.height);
      gl.uniform1f(uTime, time * 0.001);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
